# Build the netcd Docker image on every pull request and on every push to the
# default branch, and publish it to GitHub Container Registry on semver tag
# pushes.
#
# Triggers:
#   * pull_request                                  (build only, never pushed)
#   * push on the default branch (`main`)           (build only, never pushed)
#   * push of a `vX.Y.Z` or `vX.Y.Z-*` tag         (build + publish)
#   * Manual dispatch from the Actions UI
#
# There is no native (non-Docker) build pipeline: the container image is the
# only artefact, so `cargo build`/`cargo test` only ever run inside the
# builder stage of the Dockerfile.
#
# Images are pushed to:
#   * ghcr.io/<owner>/netcd                          (uses GITHUB_TOKEN,
#                                                    needs the `packages: write`
#                                                    permission granted below)
#
# Tags produced on a release: the exact semver `1.2.3`, the `1.2` and `1`
# rolling tags, plus a short git SHA. The `latest` tag is only applied on a
# manual dispatch from the default branch (so a tag push never silently
# promotes to latest).

name: docker

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Supersede in-flight runs of the same ref, but never cancel a release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docker:
    name: Build (and publish on tag)
    runs-on: ubuntu-latest
    env:
      # Publish only for releases: a semver tag push, or a manual dispatch
      # from the default branch (used to promote the `latest` tag).
      PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
      # Pull requests only get the native architecture for a fast feedback
      # loop; the release pipeline builds every published architecture.
      PLATFORMS: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/netcd
          tags: |
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Build (and push on release)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
