# Publish multi-arch Docker images on every semver tag push.
#
# Triggers:
#   * Tag push matching vX.Y.Z or vX.Y.Z-* (pre-release)
#   * Manual dispatch from the Actions UI
#
# Images are pushed to both registries when the corresponding secrets exist:
#   * ghcr.io/<owner>/netcd                          (always, uses GITHUB_TOKEN)
#   * docker.io/<DOCKERHUB_USERNAME>/netcd           (when DOCKERHUB_USERNAME
#                                                    and DOCKERHUB_TOKEN secrets
#                                                    are configured)
#
# Tags produced (per registry): the exact semver `1.2.3`, the `1.2` and `1`
# rolling tags, plus a short git SHA. The `latest` tag is only applied on a
# manual dispatch from the default branch (so a tag push never silently
# promotes to latest).

name: release-docker

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Optional: only runs when both Docker Hub secrets are configured in
      # the repository settings. Without them the build still succeeds and
      # only the GHCR image is published.
      - name: Log in to Docker Hub
        if: secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/netcd
            ${{ secrets.DOCKERHUB_USERNAME != '' && format('{0}/netcd', secrets.DOCKERHUB_USERNAME) || '' }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
